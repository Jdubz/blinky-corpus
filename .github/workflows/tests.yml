name: Tests

on:
  pull_request:
    # labeled/unlabeled: the owner's `labels-override` label re-runs the human-label checks.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # labels-sync.yml starts this on its labels/auto-* batch branch: a push and a PR made with
  # GITHUB_TOKEN start no run, so the required check on the batch's head ("Scoring tests") comes
  # from this dispatched run on the same commit.
  workflow_dispatch:

jobs:
  topology:
    name: Topology check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: No host names or private addresses (the repo is public)
      run: python3 scripts/check_topology.py

  scoring:
    name: Scoring tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0  # the label checks diff against the merge base
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    # This job is the required check on main, so a label file that fails here can't auto-merge.
    # Anti-vandalism only (tools/labels/labelcheck.py): every changed human file matches the schema,
    # doesn't delete more than half of what main has and leaves no class empty that a reference has.
    # A labels/** branch (dispatched by labels-sync.yml) may change nothing else. A batch that fails
    # stays open for the owner. On main: every human file's schema.
    - name: Human label files
      env:
        BASE_REF: ${{ github.base_ref }}
        OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'labels-override') && '--override' || '' }}
      run: |
        if [ "${{ github.event_name }}" = pull_request ]; then
          python tools/labels/labelcheck.py --base "origin/$BASE_REF" $OVERRIDE
        elif [[ "$GITHUB_REF" == refs/heads/labels/* ]]; then
          python tools/labels/labelcheck.py --base origin/main --only-labels
        else
          python tools/labels/labelcheck.py --all
        fi
    - name: Install
      # numpy: scripts/drum_suspect.py's tests, which skip without it
      run: pip install -e '.[dev,suspect]'
    - name: Every track has its labels
      run: |
        for mp3 in edm/*.mp3; do
          s=${mp3%.mp3}
          for want in "$s.onsets_consensus.json" "edm/kick_weighted/$(basename "$s").kick_weighted.json" "edm/drums_adtof/$(basename "$s").kick_weighted.json"; do
            [ -f "$want" ] || { echo "::error::missing $want"; exit 1; }
          done
        done
        echo "$(ls edm/*.mp3 | wc -l) tracks, all labelled"
    - name: Tests
      run: python -m pytest -v tests/

