name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scoring:
    name: Scoring tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install
      run: pip install -e '.[dev]'
    - name: Every track has its labels
      run: |
        for mp3 in edm/*.mp3; do
          s=${mp3%.mp3}
          for want in "$s.onsets_consensus.json" "edm/kick_weighted/$(basename "$s").kick_weighted.json"; do
            [ -f "$want" ] || { echo "::error::missing $want"; exit 1; }
          done
        done
        echo "$(ls edm/*.mp3 | wc -l) tracks, all labelled"
    - name: Tests
      run: python -m pytest -v tests/
