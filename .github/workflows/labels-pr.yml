name: Label PRs

# The labels service (blinky_time labels-service/) publishes the tracks' shared labels by itself: a
# batch is one commit on top of main, on a branch labels/auto-<time>-<id>, pushed with a deploy key
# (write access to this repo only). The service holds no GitHub token, so this workflow opens the
# pull request and turns on auto-merge (squash).
#
# What gates the merge is the required "Scoring tests" check: tests.yml runs on the same push
# (push: labels/**) and its label checks (tools/labels/labelcheck.py: anti-vandalism, and only human
# label files may change) must pass. A batch that fails stays open for the owner. A PR opened with
# GITHUB_TOKEN starts no pull_request workflows, which is why the check comes from that push run.
#
# Runs again on every push to the branch: the service rebuilds the open batch when more edits come in
# or main moves (main requires up-to-date branches). It finds the open PR and keeps auto-merge on. A
# branch whose PR was closed is never reopened.

on:
  push:
    branches: ['labels/**']

concurrency:
  group: labels-pr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write       # auto-merge merges as this token's actor, so it needs merge rights
  pull-requests: write  # open the PR, turn on auto-merge

jobs:
  open:
    name: Open the PR, auto-merge on
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 2
    - name: Open or find the PR, then turn on auto-merge (squash)
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        subject=$(git log -1 --format=%s HEAD)
        body=$(git log -1 --format=%b HEAD)
        pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number -q '.[0].number')
        if [ -z "$pr" ]; then
          # A branch whose PR was closed stays closed: a rejected save never comes back by itself
          # (e.g. on a later rebuild of the branch). The owner can reopen it by hand.
          closed=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state closed --json number -q '.[0].number')
          if [ -n "$closed" ]; then
            echo "#$closed for $BRANCH was closed: not opening another"
            exit 0
          fi
          url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
                  --title "$subject" --body "$body")
          pr=${url##*/}
          echo "opened #$pr"
        fi
        # The squash commit keeps the contributor trailers (the commit body). The label checks run on
        # the same push and may already have closed a refused PR: then there is nothing to turn on.
        if ! gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash --subject "$subject (#$pr)" --body "$body"; then
          state=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state -q .state)
          [ "$state" != OPEN ] || exit 1
          echo "#$pr is $state (the label checks refused it): auto-merge not needed"
          exit 0
        fi
        echo "auto-merge on for #$pr"
